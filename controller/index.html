<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101522" />
    <title>Party Motion Controller</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section id="joinView" class="card">
        <p class="eyebrow">PHONE CONTROLLER</p>
        <h1>Party<br /><span>Motion</span></h1>
        <p class="lede">Turn your phone into a controller. Nothing to install.</p>
        <label for="room">Room code</label>
        <input id="room" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123" />
        <label for="name">Your name</label>
        <input id="name" maxlength="18" autocomplete="nickname" placeholder="Player" />
        <button id="joinButton" class="primary">Join game</button>
        <p id="joinError" class="error" role="alert"></p>
      </section>

      <section id="controllerView" class="controller hidden">
        <header>
          <div><span class="status-dot"></span><span id="statusText">Connected</span></div>
          <strong id="roomBadge"></strong>
        </header>
        <div class="player-card">
          <p>YOU ARE</p>
          <h2 id="playerName"></h2>
          <div class="scoreline"><span>♛ <b id="crowns">0</b></span><span>PTS <b id="points">0</b></span></div>
        </div>
        <div class="game-card">
          <p id="roundLabel">LOBBY</p>
          <h3 id="gameTitle">Waiting for the host</h3>
          <p id="gameInstruction">Keep this screen open.</p>
        </div>
        <div id="motionPanel" class="motion-panel">
          <div id="bubble" class="bubble"></div>
          <div class="crosshair horizontal"></div>
          <div class="crosshair vertical"></div>
          <div class="motion-readout">
            <div><span>TILT</span><i id="tiltMeter"></i></div>
            <div><span>SHAKE</span><i id="shakeMeter"></i></div>
            <div><span>ROTATE</span><i id="rotateMeter"></i></div>
          </div>
          <p id="motionHint">Motion connected</p>
        </div>
        <div class="actions">
          <button id="calibrateButton">Calibrate</button>
        </div>
        <p class="motion-only">Gameplay is motion-only. Keep a firm grip and make space.</p>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
